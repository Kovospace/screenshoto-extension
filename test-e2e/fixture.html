<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShotKit fixture</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; background: #f8fafc; color: #0f172a; }
  header { height: 80px; background: linear-gradient(90deg, #1e3a8a, #0ea5e9); color: #fff; padding: 20px 32px; box-sizing: border-box; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 32px; }
  .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; }
  #target { background: #fef3c7; }
  #target .inner { background: #fde68a; border-radius: 8px; padding: 12px; }
  .tall { height: 1400px; }
</style>
</head>
<body>
<header><h1 style="margin:0;font-size:28px">Fixture page</h1></header>
<main>
  <section class="card">
    <h2>Text and vectors</h2>
    <p>The quick brown fox jumps over the lazy dog. 0123456789</p>
    <svg width="220" height="90" viewBox="0 0 220 90"><circle cx="45" cy="45" r="38" fill="#ef4444"/><rect x="100" y="10" width="110" height="70" rx="10" fill="#22c55e"/></svg>
  </section>
  <section class="card" id="target">
    <h2>Pick me</h2>
    <div class="inner"><span id="leaf">Leaf element inside the card</span></div>
  </section>
</main>
<div class="tall"></div>
</body>
</html>
