<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenshoto Web</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="bar">
  <div class="group seg" id="scales">
    <button data-scale="1" title="1× (key 1)">1×</button>
    <button data-scale="2" title="2× (key 2)">2×</button>
    <button data-scale="3" title="3× (key 3)">3×</button>
    <button data-scale="4" title="4× (key 4)">4×</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="tools">
    <button data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1.2L15 19l-2.4 1.1-2.5-5.8L6 18z"/></svg></button>
    <button data-tool="rect" title="Rectangle (R) — Shift for square"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
    <button data-tool="ellipse" title="Circle / ellipse (O) — Shift for circle"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button data-tool="arrow" title="Arrow (A) — Shift snaps to 45°"><svg viewBox="0 0 24 24"><path d="M5 19L18 6M10 6h8v8"/></svg></button>
    <button data-tool="text" title="Text (T) — Enter to finish, Shift+Enter new line"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
    <button data-tool="step" title="Numbered step marker (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10.5 9.5l2-1.5v8"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="group" id="colors"></div>
  <div class="group seg" id="sizes">
    <button data-size="S" title="Thin / small">S</button>
    <button data-size="M" title="Medium">M</button>
    <button data-size="L" title="Thick / large">L</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <button id="del" title="Delete selected (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="spacer"></div>
  <span id="info"></span>
  <div class="group export">
    <button id="copy" class="text" title="Copy current scale to clipboard (Ctrl+C)">Copy</button>
    <button id="save" class="text" title="Save current scale (Ctrl+S) — Shift-click to choose location">Save</button>
    <button id="saveAll" class="text primary" title="Save 1×, 2×, 3× and 4× files">Save all</button>
  </div>
  <div class="sep"></div>
  <button id="openSettings" title="Settings — save folder and file names"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</header>
<main id="stage"><div id="wrap"><canvas id="canvas"></canvas></div></main>
<div id="toast"></div>
<dialog id="settings">
  <form id="settingsForm" method="dialog" novalidate>
    <h2>Settings</h2>
    <label for="setFolder">Save to folder</label>
    <div class="field"><span class="prefix">Downloads/</span><input id="setFolder" name="folder" spellcheck="false" autocomplete="off" placeholder="(Downloads itself)"></div>
    <p class="note">Chrome lets extensions save only inside your Downloads folder. Sub-folders like <code>Screenshots/Web</code> are fine. Shift-click <b>Save</b> to pick any location for one file.</p>
    <p class="error" id="setFolderError"></p>
    <label for="setSuffix">File name suffix</label>
    <div class="field"><input id="setSuffix" name="suffix" spellcheck="false" autocomplete="off"></div>
    <p class="note"><code>{n}</code> is the scale: <code>@{n}x</code> → <code>@2x</code>, <code>_{n}</code> → <code>_2</code>, <code>_{n}x</code> → <code>_2x</code></p>
    <p class="error" id="setSuffixError"></p>
    <p class="preview-label">Example</p>
    <p class="preview" id="setPreview"></p>
    <div class="actions">
      <button type="button" id="setDefaults" class="text">Defaults</button>
      <span class="spacer"></span>
      <button type="button" id="setCancel" class="text">Cancel</button>
      <button type="submit" id="setSave" class="text primary">Save</button>
    </div>
  </form>
</dialog>
<script type="module" src="editor.js"></script>
</body>
</html>
