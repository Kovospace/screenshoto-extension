<!doctype html>
<!-- Source of small-promo-tile.png (440×280). Re-render: node store/render-graphics.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6e8ec;
    background: #0c0d10 radial-gradient(circle, #23262e 1px, transparent 1px) 0 0 / 16px 16px;
    position: relative;
  }
  .brand { position: absolute; left: 26px; top: 28px; display: flex; align-items: center; gap: 12px; }
  .brand img { width: 46px; height: 46px; }
  .name { font-size: 23px; font-weight: 750; letter-spacing: -.3px; line-height: 1.05; }
  .name span { color: #60a5fa; }
  .tagline { position: absolute; left: 26px; top: 98px; font-size: 19px; font-weight: 650; line-height: 1.25; width: 196px; }
  .tags { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 6px; }
  .tags b { font-size: 12px; font-weight: 650; padding: 5px 9px; border-radius: 99px; background: #1f232b; color: #cbd5e1; border: 1px solid #2c313b; }
  .tags b.free { background: #16a34a; border-color: #16a34a; color: #fff; }

  /* mock page with a region being adjusted */
  .page { position: absolute; right: 20px; top: 48px; width: 168px; height: 206px; border-radius: 10px; background: #f8fafc; overflow: hidden; box-shadow: 0 12px 34px rgba(0,0,0,.55); }
  .page .hd { height: 34px; background: linear-gradient(90deg, #1e3a8a, #0ea5e9); }
  .page .ln { height: 7px; border-radius: 4px; background: #cbd5e1; margin: 10px 12px 0; }
  .page .ln.s { width: 55%; } .page .ln.m { width: 75%; }
  .page .art { display: flex; gap: 8px; margin: 12px; }
  .page .art i { display: block; height: 46px; border-radius: 8px; }
  .page .art i:first-child { width: 46px; border-radius: 50%; background: #ef4444; }
  .page .art i:last-child { flex: 1; background: #22c55e; }
  .sel { position: absolute; left: 10px; top: 48px; width: 128px; height: 90px; border: 2px solid #3b82f6; box-shadow: 0 0 0 999px rgba(10,12,18,.35); }
  .sel i { position: absolute; width: 9px; height: 9px; background: #fff; border: 2px solid #3b82f6; border-radius: 2px; margin: -5.5px 0 0 -5.5px; }
  .cam { position: absolute; right: -2px; top: calc(100% + 7px); width: 36px; height: 27px; border-radius: 7px; background: #2563eb; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .cam svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .scales { position: absolute; right: 24px; top: 14px; display: flex; gap: 2px; padding: 2px; background: #1f232b; border-radius: 8px; font-size: 11px; font-weight: 700; }
  .scales b { padding: 4px 7px; border-radius: 6px; color: #9aa1ad; }
  .scales b.on { background: #2563eb; color: #fff; }
</style>
</head>
<body>
  <div class="brand"><img src="../../../public/icons/128.png" alt=""><div class="name">Screenshoto<br><span>Web</span></div></div>
  <div class="tagline">True retina screenshots, made simple.</div>
  <div class="tags"><b>1×–4× real pixels</b><b class="free">Free</b></div>

  <div class="page"><div class="hd"></div><div class="ln m"></div><div class="ln s"></div><div class="art"><i></i><i></i></div><div class="ln"></div><div class="ln m"></div><div class="ln s"></div>
  <div class="sel">
      <i style="left:0;top:0"></i><i style="left:50%;top:0"></i><i style="left:100%;top:0"></i><i style="left:100%;top:50%"></i>
      <i style="left:100%;top:100%"></i><i style="left:50%;top:100%"></i><i style="left:0;top:100%"></i><i style="left:0;top:50%"></i>
      <div class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
    </div>
  </div>
  <div class="scales"><b>1×</b><b class="on">2×</b><b>3×</b><b>4×</b></div>
</body>
</html>
